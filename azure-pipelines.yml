trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: "1.8.5"
  terraformWorkingDirectory: "$(System.DefaultWorkingDirectory)"
  azureServiceConnection: "azure-terraform-conn"
  backendResourceGroupName: "tfstate-rg"
  backendStorageAccountName: "tfstatekp2026dev123"
  backendContainerName: "tfstate"
  backendKeyDev: "terraform-dev.tfstate"
  backendKeyProd: "terraform-prod.tfstate"

stages:
- stage: Validate
  displayName: "Terraform Validate"
  jobs:
  - job: ValidateJob
    displayName: "Validate Terraform Configuration"
    steps:
    - checkout: self

    - script: |
        set -euo pipefail
        if ! command -v terraform >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
        fi
        terraform version
      displayName: "Install Terraform CLI"

    - script: terraform fmt -check -recursive
      displayName: "Terraform Format Check"
      workingDirectory: "$(terraformWorkingDirectory)"

    - script: |
        set -euo pipefail
        terraform init -backend=false
        terraform validate
      displayName: "Terraform Init + Validate"
      workingDirectory: "$(terraformWorkingDirectory)"

- stage: PlanDev
  displayName: "Terraform Plan (Dev)"
  dependsOn: Validate
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - job: PlanDevJob
    displayName: "Create Terraform Plan (Dev)"
    steps:
    - checkout: self

    - script: mkdir -p "$(Pipeline.Workspace)/tfplan"
      displayName: "Create plan artifact directory"

    - script: |
        set -euo pipefail
        if ! command -v terraform >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
        fi
        terraform version
      displayName: "Install Terraform CLI"

    - task: AzureCLI@2
      displayName: "Terraform Init + Plan (Dev)"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        workingDirectory: "$(terraformWorkingDirectory)"
        addSpnToEnvironment: true
        inlineScript: |
          set -euo pipefail
          terraform init \
            -backend-config="resource_group_name=$(backendResourceGroupName)" \
            -backend-config="storage_account_name=$(backendStorageAccountName)" \
            -backend-config="container_name=$(backendContainerName)" \
            -backend-config="key=$(backendKeyDev)"
          terraform plan -out="$(Pipeline.Workspace)/tfplan/tfplan" -input=false

    - publish: "$(Pipeline.Workspace)/tfplan"
      artifact: "terraformPlanDev"
      displayName: "Publish Terraform Plan Artifact (Dev)"

- stage: ApplyDev
  displayName: "Terraform Apply (Dev)"
  dependsOn: PlanDev
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - deployment: ApplyDev
    displayName: "Apply Infrastructure Changes (Dev)"
    environment: "dev"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - download: current
            artifact: "terraformPlanDev"
            displayName: "Download Terraform Plan Artifact (Dev)"

          - script: |
              set -euo pipefail
              if ! command -v terraform >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y unzip
                curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
                sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
              fi
              terraform version
            displayName: "Install Terraform CLI"

          - task: AzureCLI@2
            displayName: "Terraform Init + Apply (Dev)"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              workingDirectory: "$(terraformWorkingDirectory)"
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroupName)" \
                  -backend-config="storage_account_name=$(backendStorageAccountName)" \
                  -backend-config="container_name=$(backendContainerName)" \
                  -backend-config="key=$(backendKeyDev)"
                terraform apply -input=false "$(Pipeline.Workspace)/terraformPlanDev/tfplan"

- stage: PlanProd
  displayName: "Terraform Plan (Prod)"
  dependsOn: Validate
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: PlanProdJob
    displayName: "Create Terraform Plan (Prod)"
    steps:
    - checkout: self

    - script: mkdir -p "$(Pipeline.Workspace)/tfplan"
      displayName: "Create plan artifact directory"

    - script: |
        set -euo pipefail
        if ! command -v terraform >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
        fi
        terraform version
      displayName: "Install Terraform CLI"

    - task: AzureCLI@2
      displayName: "Terraform Init + Plan (Prod)"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        workingDirectory: "$(terraformWorkingDirectory)"
        addSpnToEnvironment: true
        inlineScript: |
          set -euo pipefail
          terraform init \
            -backend-config="resource_group_name=$(backendResourceGroupName)" \
            -backend-config="storage_account_name=$(backendStorageAccountName)" \
            -backend-config="container_name=$(backendContainerName)" \
            -backend-config="key=$(backendKeyProd)"
          terraform plan -out="$(Pipeline.Workspace)/tfplan/tfplan" -input=false

    - publish: "$(Pipeline.Workspace)/tfplan"
      artifact: "terraformPlanProd"
      displayName: "Publish Terraform Plan Artifact (Prod)"

- stage: ApplyProd
  displayName: "Terraform Apply (Prod)"
  dependsOn: PlanProd
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: ApplyProd
    displayName: "Apply Infrastructure Changes (Prod)"
    environment: "prod"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - download: current
            artifact: "terraformPlanProd"
            displayName: "Download Terraform Plan Artifact (Prod)"

          - script: |
              set -euo pipefail
              if ! command -v terraform >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y unzip
                curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
                sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
              fi
              terraform version
            displayName: "Install Terraform CLI"

          - task: AzureCLI@2
            displayName: "Terraform Init + Apply (Prod)"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              workingDirectory: "$(terraformWorkingDirectory)"
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroupName)" \
                  -backend-config="storage_account_name=$(backendStorageAccountName)" \
                  -backend-config="container_name=$(backendContainerName)" \
                  -backend-config="key=$(backendKeyProd)"
                terraform apply -input=false "$(Pipeline.Workspace)/terraformPlanProd/tfplan"